        - paragraph [ref=e98]: "RESUMEN EJECUTIVO: HIPERTENSIÓN ARTERIAL 1. DEFINICIÓN Y CRITERIOS DIAGNÓSTICOS La hipertensión arterial (HTA) es una enfermedad crónica que se define por la presencia de cifras de presión arterial iguales o superiores a 140/90 mmHg. Su carácter crónico implica la necesidad de seguimiento y tratamiento sostenido a largo plazo. 2. RELEVANCIA COMO FACTOR DE RIESGO CARDIOVASCULAR La HTA constituye el principal factor de riesgo cardiovascular de naturaleza modificable. Este dato subraya su importancia epidemiológica y clínica, ya que su control adecuado tiene un impacto directo y significativo en la reducción de eventos cardiovasculares mayores, como infarto de miocardio, accidente cerebrovascular e insuficiencia cardíaca. 3. ESTRATEGIAS TERAPÉUTICAS El abordaje terapéutico de la HTA es de naturaleza dual e integra dos pilares fundamentales: 3.1. Modificaciones del Estilo de Vida Se reconocen los cambios en el estilo de vida como una intervención terapéutica de primera línea, aunque el texto no detalla las medidas específicas, estas comprenden habitualmente reducción del sodio, actividad física, control del peso y moderación del consumo de alcohol. 3.2. Tratamiento Farmacológico Se identifican cuatro grandes grupos de fármacos antihipertensivos con indicación establecida: - Inhibidores de la Enzima Convertidora de Angiotensina (IECA): actúan bloqueando la conversión de angiotensina I a angiotensina II. - Antagonistas de los Receptores de Angiotensina II (ARA-II): bloquean directamente el receptor de angiotensina II, con perfil de tolerabilidad favorable. - Calcioantagonistas: reducen la resistencia vascular periférica mediante el bloqueo de canales de calcio. - Diuréticos Tiazídicos: favorecen la natriuresis y reducen la volemia, constituyendo uno de los grupos de mayor tradición en el tratamiento antihipertensivo. 4. CONCLUSIÓN La hipertensión arterial representa una entidad de alta relevancia clínica y preventiva. Su manejo requiere un enfoque combinado que integre intervenciones no farmacológicas y farmacológicas, disponiendo de múltiples grupos terapéuticos con eficacia demostrada para el control de las cifras tensionales y la reducción del riesgo cardiovascular global."