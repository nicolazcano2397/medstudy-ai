        - textbox "Pega aquí el texto médico..." [ref=e69]: Los betabloqueantes son fármacos que bloquean los receptores beta-adrenérgicos. Se clasifican en cardioselectivos (metoprolol, atenolol, bisoprolol) que bloquean solo beta-1, y no selectivos (propranolol, carvedilol) que bloquean beta-1 y beta-2. Sus indicaciones incluyen hipertensión arterial, insuficiencia cardíaca, arritmias, angina de pecho y profilaxis de migraña. Los efectos adversos incluyen bradicardia, broncoespasmo (especialmente no selectivos), fatiga, hipoglicemia enmascarada y disfunción eréctil. Están contraindicados en asma bronquial, bloqueo AV de 2° y 3° grado, y bradicardia severa.
