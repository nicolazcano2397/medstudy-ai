<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paris.cl · Análisis Cyber 2025</title>

<style>
:root {
  --navy: #0D2137;
  --blue: #185FA5;
  --blue-light: #E8F0FB;
  --green: #16A34A;
  --red: #DC2626;
  --gray-50: #F9FAFB;
  --gray-100: #F3F4F6;
  --gray-200: #E5E7EB;
  --gray-300: #D1D5DB;
  --gray-500: #6B7280;
  --gray-700: #374151;
  --gray-900: #111827;
  --white: #FFFFFF;
  --max-w: 1400px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#F0F4F8;color:var(--gray-900);font-size:14px;min-height:100vh}
/* HEADER */
#app-header{background:var(--navy);color:#fff;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:54px;position:sticky;top:0;z-index:100}
#app-header h1{font-size:16px;font-weight:700;letter-spacing:.3px}
#app-header h1 span{color:#5B9FE0;font-weight:400}
.header-tabs{display:flex;gap:2px;height:100%;align-items:flex-end}
.header-tab{padding:8px 20px;cursor:pointer;font-size:13px;font-weight:600;letter-spacing:.5px;color:rgba(255,255,255,.55);border:none;background:none;border-bottom:3px solid transparent;transition:all .2s;height:100%;display:flex;align-items:center}
.header-tab:hover{color:rgba(255,255,255,.85)}
.header-tab.active{color:#fff;border-bottom:3px solid #5B9FE0;background:rgba(91,159,224,.1)}
.header-nav-right{display:flex;gap:8px}
/* MAIN */
#main-content{max-width:var(--max-w);margin:0 auto;padding:20px}
/* UPLOAD SCREEN */
.upload-section-title{font-size:13px;font-weight:700;color:var(--gray-500);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px}
.upload-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-bottom:8px}
.drop-zone{border:2px dashed var(--gray-300);border-radius:10px;padding:16px;text-align:center;cursor:pointer;transition:all .2s;background:#fff;min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--blue);background:var(--blue-light)}
.drop-zone.loaded{border-color:var(--green);border-style:solid;background:#F0FDF4}
.drop-zone.error{border-color:var(--red);border-style:solid;background:#FEF2F2}
.drop-zone .dz-icon{font-size:22px}
.drop-zone .dz-label{font-size:12px;font-weight:600;color:var(--gray-700)}
.drop-zone .dz-sub{font-size:11px;color:var(--gray-500)}
.drop-zone .dz-info{font-size:11px;color:var(--green);font-weight:600}
.drop-zone.error .dz-info{color:var(--red)}
.drop-zone input[type=file]{display:none}
/* BUTTONS */
.btn{padding:9px 20px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .2s}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:hover{background:#1450a0}
.btn-primary:disabled{background:var(--gray-300);cursor:not-allowed}
.btn-secondary{background:var(--gray-100);color:var(--gray-700);border:1px solid var(--gray-200)}
.btn-secondary:hover{background:var(--gray-200)}
.btn-sm{padding:5px 12px;font-size:12px}
.btn-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
/* DASHBOARD */
#dashboard{display:none}
/* SUB-NAV TABS */
.sub-nav{background:#fff;border-bottom:1px solid var(--gray-200);display:flex;gap:0;overflow-x:auto;position:sticky;top:54px;z-index:90}
.sub-tab{padding:10px 18px;cursor:pointer;font-size:12px;font-weight:600;color:var(--gray-500);border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s;border:none;background:none}
.sub-tab:hover{color:var(--blue);background:var(--blue-light)}
.sub-tab.active{color:var(--blue);border-bottom:3px solid var(--blue);background:var(--blue-light)}
.sub-tab-group{display:flex;align-items:center;border-right:1px solid var(--gray-200);padding-right:4px;margin-right:4px}
.sub-tab-group-label{font-size:10px;font-weight:700;color:var(--gray-400);letter-spacing:.8px;text-transform:uppercase;padding:0 12px;align-self:center}
/* CARDS */
.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.card{background:#fff;border-radius:10px;padding:16px;border:1px solid var(--gray-200)}
.card-label{font-size:11px;color:var(--gray-500);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.card-value{font-size:22px;font-weight:700;color:var(--navy)}
.card-sub{font-size:11px;color:var(--gray-500);margin-top:2px}
/* FILTERS */
.filter-bar{background:#fff;border-radius:10px;padding:14px 16px;border:1px solid var(--gray-200);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.filter-group{display:flex;flex-direction:column;gap:4px}
.filter-label{font-size:11px;font-weight:600;color:var(--gray-500);text-transform:uppercase;letter-spacing:.4px}
.filter-group select,.filter-group input[type=text]{padding:6px 10px;border:1px solid var(--gray-200);border-radius:6px;font-size:12px;background:#fff;color:var(--gray-700);min-width:140px}
.filter-group select:focus,.filter-group input[type=text]:focus{outline:2px solid var(--blue);border-color:var(--blue)}
/* TABLE */
.table-wrap{background:#fff;border-radius:10px;border:1px solid var(--gray-200);overflow:hidden;margin-bottom:20px}
.table-header-row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--gray-200)}
.table-title{font-size:13px;font-weight:700;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:12px}
table th{background:var(--gray-50);padding:8px 10px;text-align:left;font-weight:700;color:var(--gray-700);border-bottom:1px solid var(--gray-200);white-space:nowrap;cursor:pointer;user-select:none;position:sticky;top:0}
table th:hover{background:var(--gray-100)}
table td{padding:7px 10px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
table tr:last-child td{border-bottom:none}
table tr:nth-child(even){background:var(--gray-50)}
table tr:hover{background:#EEF4FB}
.sort-indicator{color:var(--blue);margin-left:3px}
.pos-bar{height:6px;background:var(--blue);border-radius:3px;min-width:2px}
.pos-bar-wrap{width:80px;background:var(--gray-200);border-radius:3px;overflow:hidden}
.up{color:var(--green)}
.down{color:var(--red)}
.neutral{color:var(--gray-500)}
/* CHART CONTAINER */
.chart-wrap{background:#fff;border-radius:10px;border:1px solid var(--gray-200);padding:16px;margin-bottom:20px}
.chart-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:14px}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.chart-wrap canvas{max-height:320px}
/* URL DETAIL PANEL */
.url-panel{background:#fff;border-radius:10px;border:1px solid var(--blue);padding:16px;margin-bottom:20px;display:none}
.url-panel.open{display:block}
.url-panel-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:12px;display:flex;align-items:center;gap:8px}
/* BADGE */
.badge{display:inline-block;padding:2px 7px;border-radius:12px;font-size:10px;font-weight:700;background:var(--blue-light);color:var(--blue)}
.badge-green{background:#D1FAE5;color:var(--green)}
.badge-red{background:#FEE2E2;color:var(--red)}
/* EVOLUTION TABLE */
.evol-table th,.evol-table td{min-width:90px}
.evol-cell-up{background:#D1FAE5;color:var(--green);font-weight:600}
.evol-cell-down{background:#FEE2E2;color:var(--red);font-weight:600}
/* COMPARE TABLE */
.compare-top-gain{background:#D1FAE5}
.compare-top-loss{background:#FEE2E2}
/* EMPTY STATE */
.empty-state{text-align:center;padding:48px;color:var(--gray-500)}
.empty-state .es-icon{font-size:36px;margin-bottom:8px}
/* BRAND EXPAND */
.brand-row-detail{background:#EEF4FB}
.brand-kw-table{width:100%;font-size:11px}
.brand-kw-table td{padding:5px 10px}
/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;font-weight:600;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
/* RESPONSIVE */
@media(max-width:768px){
  .charts-row{grid-template-columns:1fr}
  .cards-row{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>

// =====================================================================
// BRAND MATCHING  — tolerante a tildes, mayúsculas, errores tipográficos
// =====================================================================
function normalizeStr(s){
  return (s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9\s]/g,' ')
    .replace(/\s+/g,' ').trim();
}

// Levenshtein para fuzzy match
function levenshtein(a,b){
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}

let brandsSorted = []; // [{original, norm}] sorted by length desc

function buildBrandsIndex(brands){
  brandsSorted = brands.map(b=>({original:b,norm:normalizeStr(b)}))
    .filter(b=>b.norm.length>=2)
    .sort((a,b)=>b.norm.length-a.norm.length);
}

function matchBrand(keyword){
  const kw = normalizeStr(keyword);
  for(const brand of brandsSorted){
    const b = brand.norm;
    // Exact substring as word boundary
    const escaped = b.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const regex = new RegExp(`(^|[\\s\\-\\/])${escaped}([\\s\\-\\/]|$)`,'i');
    if(regex.test(kw)) return brand.original;
    // Fuzzy: if brand length >= 4, allow 1 typo; if >= 7, allow 2
    if(b.length>=4){
      const maxDist = b.length>=7?2:1;
      // Check each word of keyword
      const words = kw.split(/\s+/);
      for(const word of words){
        if(Math.abs(word.length-b.length)<=maxDist && levenshtein(word,b)<=maxDist)
          return brand.original;
      }
      // Check consecutive bigrams in kw
      if(b.includes(' ')){
        const bWords=b.split(/\s+/);
        for(let i=0;i<=words.length-bWords.length;i++){
          const candidate=words.slice(i,i+bWords.length).join(' ');
          if(levenshtein(candidate,b)<=maxDist) return brand.original;
        }
      }
    }
  }
  return null;
}

// =====================================================================
// CSV PARSER
// =====================================================================
function parseCSV(text){
  const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n').filter(l=>l.trim());
  if(!lines.length) return [];
  // Detect separator
  const firstLine = lines[0];
  const sep = (firstLine.split(';').length > firstLine.split(',').length) ? ';' : ',';

  function splitLine(line){
    const res=[]; let cur=''; let inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){inQ=!inQ;continue;}
      if(c===sep&&!inQ){res.push(cur.trim());cur='';continue;}
      cur+=c;
    }
    res.push(cur.trim());
    return res;
  }

  function parseNum(v){
    if(!v||v==='-'||v==='N/A'||v==='') return null;
    // Remove thousands separators (comma or period used as thousands)
    let s = v.toString().replace(/[%\s]/g,'');
    // If has both . and ,: determine which is decimal
    if(s.includes(',')&&s.includes('.')){
      // e.g. 1.234,56 → 1234.56
      s=s.replace(/\./g,'').replace(',','.');
    } else if(s.includes(',')&&!s.includes('.')){
      // Could be thousands separator (1,234) or decimal (1,5)
      const parts=s.split(',');
      if(parts.length===2&&parts[1].length<=2) s=s.replace(',','.');
      else s=s.replace(/,/g,'');
    }
    const n=parseFloat(s);
    return isNaN(n)?null:n;
  }

  // Detect if first row is header
  const firstCols = splitLine(lines[0]);
  const isHeader = isNaN(parseFloat(firstCols[1]));
  const dataLines = isHeader ? lines.slice(1) : lines;

  return dataLines.map(line=>{
    const cols = splitLine(line);
    return {
      key:     (cols[0]||'').trim(),
      clicks:  parseNum(cols[1]),
      dClicks: parseNum(cols[2]),
      impr:    parseNum(cols[3]),
      dImpr:   parseNum(cols[4]),
      pos:     parseNum(cols[5]),
      dPos:    parseNum(cols[6]),
      ctr:     parseNum(cols[7]),
      dCtr:    parseNum(cols[8]),
    };
  }).filter(r=>r.key);
}

function parseBrandCSV(text){
  const lines = text.replace(/\r\n/g,'\n').split('\n').filter(l=>l.trim());
  const sep = lines[0]&&lines[0].includes(';')?';':',';
  const brands=new Set();
  lines.forEach(line=>{
    const cols=line.split(sep);
    const brand=(cols[1]||'').replace(/"/g,'').trim();
    if(brand&&brand.toLowerCase()!=='brand'&&brand.length>=2) brands.add(brand.toLowerCase());
  });
  return [...brands];
}

// AGGREGATION
// =====================================================================
function aggregateBySubcat(rows){
  const map={};
  let totalImpr=0;
  rows.forEach(r=>{
    if(!r.impr) return;
    const info=categorize(r.key);
    if(!info) return; // excludes PDP, Listas
    const key=`${info.cat}|||${info.subcat}`;
    if(!map[key]) map[key]={cat:info.cat,subcat:info.subcat,impr:0,clicks:0,dImpr:0,dClicks:0,
      ctrNum:0,ctrDen:0,dCtr:0,dCtrN:0,posNum:0,posDen:0,dPos:0,dPosN:0,urls:[],urlSet:new Set()};
    const m=map[key];
    m.impr+=(r.impr||0); m.clicks+=(r.clicks||0);
    m.dImpr+=(r.dImpr||0); m.dClicks+=(r.dClicks||0);
    if(r.ctr!=null&&r.impr){m.ctrNum+=r.ctr*(r.impr||1);m.ctrDen+=(r.impr||1);}
    if(r.dCtr!=null){m.dCtr+=r.dCtr;m.dCtrN++;}
    if(r.pos!=null&&r.impr){m.posNum+=r.pos*(r.impr||1);m.posDen+=(r.impr||1);}
    if(r.dPos!=null){m.dPos+=r.dPos;m.dPosN++;}
    if(!m.urlSet.has(r.key)){m.urlSet.add(r.key);m.urls.push(r);}
    totalImpr+=(r.impr||0);
  });
  const arr=Object.values(map).map(m=>({
    cat:m.cat, subcat:m.subcat,
    impr:m.impr, clicks:m.clicks, dImpr:m.dImpr, dClicks:m.dClicks,
    ctr: m.ctrDen?m.ctrNum/m.ctrDen:null,
    dCtr: m.dCtrN?m.dCtr/m.dCtrN:null,
    pos: m.posDen?m.posNum/m.posDen:null,
    dPos: m.dPosN?m.dPos/m.dPosN:null,
    urlCount:m.urlSet.size,
    urls: m.urls.sort((a,b)=>(b.impr||0)-(a.impr||0)),
    share: totalImpr?m.impr/totalImpr*100:0,
    pctDImpr: (m.impr-m.dImpr)?m.dImpr/(m.impr-m.dImpr)*100:null,
    pctDClicks: (m.clicks-m.dClicks)?m.dClicks/(m.clicks-m.dClicks)*100:null,
  })).sort((a,b)=>b.impr-a.impr);

  // gap vs top
  const topImpr = arr[0]?.impr||1;
  arr.forEach((r,i)=>{
    r.rank=i+1;
    r.gapVsTop=topImpr-r.impr;
    r.gapPct=r.impr?r.gapVsTop/topImpr*100:100;
  });
  return arr;
}

function aggregateByBrand(rows){
  const map={};
  let totalImpr=0;
  rows.forEach(r=>{

      ctrNum:0,ctrDen:0,dCtr:0,dCtrN:0,posNum:0,posDen:0,dPos:0,dPosN:0,kwCount:0,kws:[]};

    m.kwCount++; m.kws.push(r);
    totalImpr+=(r.impr||0);
  });
  const arr=Object.values(map).map(m=>({

    share: totalImpr?m.impr/totalImpr*100:0,
    pctDImpr: (m.impr-m.dImpr)?m.dImpr/(m.impr-m.dImpr)*100:null,
    pctDClicks: (m.clicks-m.dClicks)?m.dClicks/(m.clicks-m.dClicks)*100:100,

  arr.forEach((r,i)=>{r.rank=i+1;r.gapVsTop=topImpr-r.impr;r.gapPct=r.impr?r.gapVsTop/topImpr*100:100;});
  return arr;
}

const fN = n => n==null?'-':Math.round(n).toLocaleString('es-CL');
const fD = n => n==null?'-':n.toFixed(1);
const fP = n => n==null?'-':`${n>=0?'+':''}${n.toFixed(1)}%`;
const fPct = n => n==null?'-':`${n.toFixed(1)}%`;

function deltaClass(n, invertColors=false){
  if(n==null||n===0) return 'neutral';
  if(invertColors) return n<0?'up':'down';
  return n>0?'up':'down';
}
function deltaArrow(n, invertColors=false){
  if(n==null||n===0) return '→';
  if(invertColors) return n<0?'↑':'↓';
  return n>0?'↑':'↓';
}

function makeDropZone(container, periodKey, module, label, required){
  const id=`dz-${module}-${periodKey}`;
  const wrap=document.createElement('div');
  wrap.innerHTML=`
    <div class="drop-zone" id="${id}" ondragover="dzDragOver(event,'${id}')" ondragleave="dzDragLeave(event,'${id}')" ondrop="dzDrop(event,'${id}','${module}','${periodKey}')">
      <input type="file" accept=".csv" id="fi-${id}" onchange="dzFileInput(event,'${id}','${module}','${periodKey}')">
      <div class="dz-icon">${required?'📋':'📅'}</div>
      <div class="dz-label">${label}</div>
      <div class="dz-sub">${required?'Requerido':'Opcional'}</div>
      <div class="dz-info" id="dz-info-${id}"></div>
      <button class="btn btn-secondary btn-sm" style="margin-top:6px" onclick="document.getElementById('fi-${id}').click()">Seleccionar CSV</button>
    </div>`;
  container.appendChild(wrap.firstElementChild);
}

function initUploadUI(){
  const pageDrops=document.getElementById('page-drops');
  const kwDrops=document.getElementById('kw-drops');
  pageDrops.innerHTML=''; kwDrops.innerHTML='';
  PERIODS.forEach(p=>{
    makeDropZone(pageDrops,p.key,'page',p.label,p.required);
    makeDropZone(kwDrops,p.key,'kw',p.label,p.required);
  });
  // Brand drop
  const bdw=document.getElementById('brand-drop-wrap');
  bdw.innerHTML=`
    <div class="drop-zone loaded" id="dz-brand" style="max-width:300px" ondragover="dzDragOver(event,'dz-brand')" ondragleave="dzDragLeave(event,'dz-brand')" ondrop="dzDropBrand(event)">
      <input type="file" accept=".csv" id="fi-dz-brand" onchange="dzFileInputBrand(event)">
      <div class="dz-icon">🏷</div>
      <div class="dz-label">Marcas pre-cargadas</div>
      <div class="dz-info" id="dz-info-dz-brand">✓ 21.573 marcas cargadas</div>
      <div class="dz-sub" style="margin-top:4px">Podés reemplazar con otro CSV</div>
      <button class="btn btn-secondary btn-sm" style="margin-top:6px" onclick="document.getElementById('fi-dz-brand').click()">Reemplazar CSV</button>
    </div>`;
}

function dzDragOver(e,id){e.preventDefault();document.getElementById(id).classList.add('dragover');}
function dzDragLeave(e,id){document.getElementById(id).classList.remove('dragover');}

function dzDrop(e,id,module,period){
  e.preventDefault();
  document.getElementById(id).classList.remove('dragover');
  const file=e.dataTransfer.files[0];
  if(file) processFile(file,id,module,period);
}
function dzFileInput(e,id,module,period){
  const file=e.target.files[0];
  if(file) processFile(file,id,module,period);
}
function dzDropBrand(e){
  e.preventDefault();
  document.getElementById('dz-brand').classList.remove('dragover');
  const file=e.dataTransfer.files[0];
  if(file) processBrandFile(file);
}
function dzFileInputBrand(e){
  const file=e.target.files[0];
  if(file) processBrandFile(file);
}

function processFile(file,id,module,period){
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const rows=parseCSV(e.target.result);
      if(module==='page') pageFiles[period]={name:file.name,rows};
      else kwFiles[period]={name:file.name,rows};
      const dz=document.getElementById(id);
      dz.classList.remove('error'); dz.classList.add('loaded');
      const totalImpr=rows.reduce((s,r)=>s+(r.impr||0),0);
      document.getElementById(`dz-info-${id}`).textContent=`✓ ${rows.length} filas · ${fN(totalImpr)} imp`;
      checkAnalyzeBtn();
    }catch(err){
      document.getElementById(id).classList.add('error');
      document.getElementById(`dz-info-${id}`).textContent='Error al parsear CSV';
    }
  };
  reader.readAsText(file,'UTF-8');
}

function processBrandFile(file){
  const reader=new FileReader();
  reader.onload=e=>{
    const brands=parseBrandCSV(e.target.result);
    brandList=brands;
    buildBrandsIndex(brands);
    brandFileLoaded=true;
    const dz=document.getElementById('dz-brand');
    dz.classList.add('loaded');
    document.getElementById('dz-info-dz-brand').textContent=`✓ ${brands.length} marcas cargadas`;
  };
  reader.readAsText(file,'UTF-8');
}

function checkAnalyzeBtn(){
  const hasAny=Object.values(pageFiles).some(f=>f)||Object.values(kwFiles).some(f=>f);
  document.getElementById('btn-analyze').disabled=!hasAny;
}

// MODULE SWITCH
// =====================================================================
function switchModule(mod){
  currentModule=mod;
  document.querySelectorAll('.header-tab').forEach((t,i)=>{
    t.classList.toggle('active',i===(mod==='pages'?0:1));
  });
  document.getElementById('pages-subnav').style.display=mod==='pages'?'flex':'none';
  document.getElementById('kw-subnav').style.display=mod==='keywords'?'flex':'none';
  renderCurrentTab();
}

// =====================================================================
// ANALYZE
// =====================================================================
function analyze(){
  // Parse data
  PERIODS.forEach(p=>{
    if(pageFiles[p.key]) pageData[p.key]=pageFiles[p.key].rows;
    if(kwFiles[p.key])   kwData[p.key]=kwFiles[p.key].rows;
  });

  // Build subnavs
  buildSubNavPages();
  buildSubNavKw();

  document.getElementById('upload-screen').style.display='none';
  document.getElementById('dashboard').style.display='block';
  switchModule('pages');
}

function goUpload(){
  document.getElementById('upload-screen').style.display='block';
  document.getElementById('dashboard').style.display='none';
}

function buildSubNavPages(){
  const container=document.getElementById('pages-tabs');
  container.innerHTML='';
  const tabs=[{key:'summary',label:'Resumen Cyber'}];
  PERIODS.forEach(p=>{ if(pageData[p.key]) tabs.push({key:'page-'+p.key,label:p.shortLabel}); });
  tabs.push({key:'compare-pages',label:'Comparar períodos'});
  tabs.forEach(t=>{
    const btn=document.createElement('button');
    btn.className='sub-tab'+(t.key==='summary'?' active':'');
    btn.textContent=t.label;
    btn.onclick=()=>{ currentTab=t.key; document.querySelectorAll('#pages-tabs .sub-tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderCurrentTab(); };
    container.appendChild(btn);
  });
  currentTab='summary';
}

function buildSubNavKw(){
  const container=document.getElementById('kw-tabs');
  container.innerHTML='';
  const tabs=[{key:'kw-summary',label:'Resumen Marcas'}];
  PERIODS.forEach(p=>{ if(kwData[p.key]) tabs.push({key:'kw-'+p.key,label:'KW '+p.shortLabel}); });
  tabs.push({key:'compare-brands',label:'Comparar Marcas'});
  tabs.forEach(t=>{
    const btn=document.createElement('button');
    btn.className='sub-tab';
    btn.textContent=t.label;
    btn.onclick=()=>{ currentTab=t.key; document.querySelectorAll('#kw-tabs .sub-tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); renderCurrentTab(); };
    container.appendChild(btn);
  });
}

function renderCurrentTab(){
  destroyCharts();
  const el=document.getElementById('tab-content');
  el.innerHTML='';
  if(currentTab==='summary') renderSummaryPages(el);
  else if(currentTab.startsWith('page-')) renderPeriodPages(el, currentTab.replace('page-',''));
  else if(currentTab==='compare-pages') renderComparePages(el);
  else if(currentTab==='kw-summary') renderSummaryBrands(el);
  else if(currentTab.startsWith('kw-')) renderPeriodKw(el, currentTab.replace('kw-',''));
  else if(currentTab==='compare-brands') renderCompareBrands(el);
}

function renderSummaryPages(el){
  // Aggregate cyber days (day1+day2+day3)
  const cyberRows=[];
  ['day1','day2','day3'].forEach(d=>{ if(pageData[d]) cyberRows.push(...pageData[d]); });
  if(!cyberRows.length){el.innerHTML='<div class="empty-state"><div class="es-icon">📭</div><div>No hay datos de páginas cargados</div></div>';return;}

  const agg=aggregateBySubcat(cyberRows);
  const topImpr=agg[0]?.impr||1;
  const totalImpr=agg.reduce((s,r)=>s+r.impr,0);
  const totalClicks=agg.reduce((s,r)=>s+r.clicks,0);
  const avgCtr=totalImpr?totalClicks/totalImpr*100:0;

  el.innerHTML=`
    <div class="cards-row">
      <div class="card"><div class="card-label">Total Impresiones</div><div class="card-value">${fN(totalImpr)}</div><div class="card-sub">Suma Días 1+2+3 Cyber</div></div>
      <div class="card"><div class="card-label">Total Clics</div><div class="card-value">${fN(totalClicks)}</div></div>
      <div class="card"><div class="card-label">CTR Promedio</div><div class="card-value">${fPct(avgCtr)}</div></div>
      <div class="card"><div class="card-label">Subcategorías Activas</div><div class="card-value">${agg.length}</div></div>
      <div class="card"><div class="card-label">Subcategoría Líder</div><div class="card-value" style="font-size:14px">${agg[0]?.subcat||'-'}</div><div class="card-sub">${fN(agg[0]?.impr)} imp</div></div>
    </div>
    <div class="charts-row">
      <div class="chart-wrap"><div class="chart-title">Top 10 Subcategorías — Distribución de Impresiones</div><canvas id="chart-pie" style="max-height:300px"></canvas></div>
      <div class="chart-wrap"><div class="chart-title">Gap vs #1 — Top 10 Subcategorías</div><canvas id="chart-gap" style="max-height:300px"></canvas></div>
    </div>
    <div class="chart-wrap" id="evol-wrap"><div class="chart-title">Evolución día a día — Top 15 Subcategorías (Impresiones)</div><div id="evol-table-wrap"></div></div>
  `;

  // PIE CHART top 10
  const top10=agg.slice(0,10);
  setTimeout(()=>{
    const pieCfg={
      type:'doughnut',
      data:{labels:top10.map(r=>r.subcat),datasets:[{data:top10.map(r=>r.impr),backgroundColor:PALETTE.slice(0,10),borderWidth:2,borderColor:'#fff'}]},
      options:{responsive:true,plugins:{legend:{position:'right',labels:{font:{size:11},boxWidth:12}},tooltip:{callbacks:{label:c=>`${c.label}: ${fN(c.raw)} imp (${fPct(c.raw/totalImpr*100)})`}}}}
    };
    const c=new Chart(document.getElementById('chart-pie'),pieCfg);
    allCharts.push(c);

    // GAP chart
    const top10Agg=aggregateBySubcat(cyberRows).slice(0,10);
    const gapCfg={
      type:'bar',
      data:{labels:top10Agg.map(r=>r.subcat),datasets:[
        {label:'Impresiones',data:top10Agg.map(r=>r.impr),backgroundColor:PALETTE.slice(0,10)}
      ]},
      options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>`${fN(c.raw)} imp`}}},scales:{x:{ticks:{callback:v=>fN(v)}}}}
    };
    const c2=new Chart(document.getElementById('chart-gap'),gapCfg);
    allCharts.push(c2);
  },50);

  // EVOLUTION TABLE
  const days=['day1','day2','day3'];
  const dayLabels=['Día 1','Día 2','Día 3'];
  const aggPerDay={};
  days.forEach(d=>{ if(pageData[d]) aggPerDay[d]=aggregateBySubcat(pageData[d]); });
  const topSubcats=agg.slice(0,15).map(r=>r.subcat);
  if(Object.keys(aggPerDay).length>0){
    let html=`<div style="overflow-x:auto"><table class="evol-table"><thead><tr><th>Subcategoría</th>`;
    days.forEach((d,i)=>{ if(aggPerDay[d]) html+=`<th>${dayLabels[i]}<br><small>Imp.</small></th>`; });
    html+='</tr></thead><tbody>';
    topSubcats.forEach(sub=>{
      html+=`<tr><td><strong>${sub}</strong></td>`;
      let prev=null;
      days.forEach((d,i)=>{
        if(!aggPerDay[d]){html+=`<td>-</td>`;return;}
        const row=aggPerDay[d].find(r=>r.subcat===sub);
        const val=row?row.impr:0;
        let cls='';
        if(prev!==null) cls=val>prev?'evol-cell-up':val<prev?'evol-cell-down':'';
        html+=`<td class="${cls}">${fN(val)}</td>`;
        prev=val;
      });
      html+='</tr>';
    });
    html+='</tbody></table></div>';
    document.getElementById('evol-table-wrap').innerHTML=html;
  }
}

function renderPeriodCharts(periodKey, agg){
  const top10=agg.slice(0,10);
  const totalImpr=agg.reduce((s,r)=>s+r.impr,0);
  setTimeout(()=>{
    const pie=document.getElementById(`chart-pie-${periodKey}`);
    const bar=document.getElementById(`chart-bar-${periodKey}`);

    const c1=new Chart(pie,{type:'doughnut',data:{labels:top10.map(r=>r.subcat),datasets:[{data:top10.map(r=>r.impr),backgroundColor:PALETTE.slice(0,10),borderWidth:2,borderColor:'#fff'}]},options:{responsive:true,plugins:{legend:{position:'right',labels:{font:{size:10},boxWidth:10}},tooltip:{callbacks:{label:c=>`${c.label}: ${fN(c.raw)} imp`}}}}});
    const c2=new Chart(bar,{type:'bar',data:{labels:top10.map(r=>r.subcat),datasets:[{label:'Impr',data:top10.map(r=>r.impr),backgroundColor:PALETTE.slice(0,10)}]},options:{indexAxis:'y',responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{callback:v=>fN(v)}}}}});
    allCharts.push(c1,c2);
  },50);
}

function applyPageFilters(periodKey){
  const cat=document.getElementById(`fcat-${periodKey}`)?.value||'';
  const subcat=document.getElementById(`fsubcat-${periodKey}`)?.value||'';
  const search=(document.getElementById(`fsearch-${periodKey}`)?.value||'').toLowerCase();
  let data=window[`tableData_${periodKey}`]||[];
  if(cat) data=data.filter(r=>r.cat===cat);
  if(subcat) data=data.filter(r=>r.subcat===subcat);
  if(search) data=data.filter(r=>r.subcat.toLowerCase().includes(search)||r.cat.toLowerCase().includes(search));
  renderPageTable(periodKey, data);
}

function resetPageFilters(periodKey){
  const fields=[`fcat-${periodKey}`,`fsubcat-${periodKey}`,`fsearch-${periodKey}`];
  fields.forEach(id=>{const el=document.getElementById(id);if(el) el.value='';});
  applyPageFilters(periodKey);
}

function sortTable(periodKey, col){
  const sort=window[`tableSort_${periodKey}`];
  if(sort.col===col) sort.asc=!sort.asc; else{sort.col=col;sort.asc=false;}
  window[`tableSort_${periodKey}`]=sort;
  applyPageFilters(periodKey);
}

function renderPageTable(periodKey, data){
  const sort=window[`tableSort_${periodKey}`]||{col:'impr',asc:false};
  const sorted=[...data].sort((a,b)=>{
    const av=a[sort.col]??-Infinity, bv=b[sort.col]??-Infinity;
    if(typeof av==='string') return sort.asc?av.localeCompare(bv):bv.localeCompare(av);
    return sort.asc?av-bv:bv-av;
  });
  const maxImpr=sorted[0]?.impr||1;
  const tbody=document.getElementById(`tbody-${periodKey}`);
  if(!tbody) return;
  tbody.innerHTML=sorted.map((r,i)=>{
    const di=r.dImpr, dc=r.dClicks, dctr=r.dCtr, dp=r.dPos;
    const barW=Math.round(r.impr/maxImpr*80);
    return `<tr>
      <td>${i+1}</td>
      <td><span class="badge">${r.cat}</span></td>
      <td><strong>${r.subcat}</strong></td>
      <td>${r.urlCount}</td>
      <td>
        <div style="display:flex;align-items:center;gap:6px">
          <span>${fN(r.impr)}</span>
          <div class="pos-bar-wrap"><div class="pos-bar" style="width:${barW}px"></div></div>
        </div>
      </td>
      <td class="${deltaClass(di)}">${deltaArrow(di)} ${fN(di)}</td>
      <td class="${deltaClass(r.pctDImpr)}">${fP(r.pctDImpr)}</td>
      <td>${fN(r.clicks)}</td>
      <td class="${deltaClass(dc)}">${deltaArrow(dc)} ${fN(dc)}</td>
      <td class="${deltaClass(r.pctDClicks)}">${fP(r.pctDClicks)}</td>
      <td>${fPct(r.ctr)}</td>
      <td class="${deltaClass(dctr)}">${fP(dctr)}</td>
      <td>${fD(r.pos)}</td>
      <td class="${deltaClass(dp,true)}">${deltaArrow(dp,true)} ${fD(dp)}</td>
      <td>${fPct(r.share)}</td>
      <td>${fN(r.gapVsTop)}</td>
      <td><button class="btn btn-secondary btn-sm" onclick="showUrlPanel('${periodKey}','${escapeQ(r.subcat)}')">Ver URLs</button></td>
    </tr>`;
  }).join('');
}

function escapeQ(s){ return (s||'').replace(/'/g,"\\'"); }

function showUrlPanel(periodKey, subcat){

      <div class="filter-group"><div class="filter-label">Período B</div>
        <select id="cmp-b" onchange="renderCompareTable()">${available.map((p,i)=>`<option value="${p.key}" ${i===1?'selected':''}>${p.label}</option>`).join('')}</select></div>
    </div>

function renderCompareTable(){
  const a=document.getElementById('cmp-a')?.value;
  const b=document.getElementById('cmp-b')?.value;
  if(!a||!b||!pageData[a]||!pageData[b]) return;
  const aggA=aggregateBySubcat(pageData[a]);
  const aggB=aggregateBySubcat(pageData[b]);
  const allSubs=[...new Set([...aggA.map(r=>r.subcat),...aggB.map(r=>r.subcat)])];
  const rows=allSubs.map(sub=>{
    const ra=aggA.find(r=>r.subcat===sub)||{impr:0,ctr:null,pos:null};
    const rb=aggB.find(r=>r.subcat===sub)||{impr:0,ctr:null,pos:null};
    const dImpr=rb.impr-ra.impr;
    const pct=ra.impr?dImpr/ra.impr*100:null;
    return {sub,cat:(ra.cat||rb.cat||''),imprA:ra.impr,imprB:rb.impr,dImpr,pct,ctrA:ra.ctr,ctrB:rb.ctr,posA:ra.pos,posB:rb.pos};
  }).sort((a,b)=>b.dImpr-a.dImpr);

  const top5gain=rows.slice(0,5).map(r=>r.sub);
  const top5loss=rows.slice(-5).map(r=>r.sub);

  let html=`<div style="overflow-x:auto"><table><thead><tr>
    <th>Categoría</th><th>Subcategoría</th><th>Impr A</th><th>Impr B</th><th>Δ Absoluto</th><th>% Cambio</th>
    <th>CTR A</th><th>CTR B</th><th>Pos A</th><th>Pos B</th>
  </tr></thead><tbody>`;
  rows.forEach(r=>{
    const cls=top5gain.includes(r.sub)?'compare-top-gain':top5loss.includes(r.sub)?'compare-top-loss':'';
    html+=`<tr class="${cls}">
      <td><span class="badge">${r.cat}</span></td>
      <td><strong>${r.sub}</strong></td>
      <td>${fN(r.imprA)}</td><td>${fN(r.imprB)}</td>
      <td class="${deltaClass(r.dImpr)}">${deltaArrow(r.dImpr)} ${fN(r.dImpr)}</td>
      <td class="${deltaClass(r.pct)}">${fP(r.pct)}</td>
      <td>${fPct(r.ctrA)}</td><td>${fPct(r.ctrB)}</td>
      <td>${fD(r.posA)}</td><td>${fD(r.posB)}</td>
    </tr>`;
  });
  html+='</tbody></table></div>';
  document.getElementById('compare-table-wrap').innerHTML=`<div class="table-wrap">${html}</div>`;
}

function applyBrandFilters(periodKey){
  const search=(document.getElementById(`fbrand-${periodKey}`)?.value||'').toLowerCase();
  const sinMarca=document.getElementById(`fsinmarca-${periodKey}`)?.value!=='0';
  let data=window[`brandData_${periodKey}`]||[];
  if(!sinMarca) data=data.filter(r=>r.brand!=='Sin Marca');
  if(search) data=data.filter(r=>r.brand.toLowerCase().includes(search));
  renderBrandTable(periodKey, data);
}

function resetBrandFilters(periodKey){
  const el1=document.getElementById(`fbrand-${periodKey}`);
  const el2=document.getElementById(`fsinmarca-${periodKey}`);
  if(el1) el1.value='';
  if(el2) el2.value='1';
  applyBrandFilters(periodKey);
}

function toggleBrandKw(btn, brand, periodKey){
  const tbody=document.getElementById(`tbody-brand-${periodKey}`);
  const rows=tbody?.querySelectorAll('tr');
  if(!rows) return;
  // Find the detail row
  rows.forEach((row,i)=>{
    if(row.id&&row.id.startsWith(`kw-detail-${periodKey}-`)){
      const detailIdx=parseInt(row.id.split('-').pop());
      const mainRow=tbody.querySelectorAll(`tr:not([id])`)[detailIdx];
      if(mainRow?.querySelector('button')===btn||row.previousElementSibling?.querySelector('button')===btn){
        const isOpen=row.style.display!=='none';
        row.style.display=isOpen?'none':'table-row';
        btn.textContent=isOpen?'Ver KWs ▼':'Ocultar ▲';
      }
    }
  });
}

    return {brand,imprA:ra.impr,imprB:rb.impr,dImpr,pct,ctrA:ra.ctr,ctrB:rb.ctr,posA:ra.pos,posB:rb.pos};
  }).sort((a,b)=>b.dImpr-a.dImpr);

  </tr></thead><tbody>`;
  rows.forEach(r=>{
    const cls=top5.includes(r.brand)?'compare-top-gain':bot5.includes(r.brand)?'compare-top-loss':'';
    html+=`<tr class="${cls}"><td><strong>${r.brand}</strong></td><td>${fN(r.imprA)}</td><td>${fN(r.imprB)}</td>

      <td class="${deltaClass(r.pct)}">${fP(r.pct)}</td>
      <td>${fPct(r.ctrA)}</td><td>${fPct(r.ctrB)}</td><td>${fD(r.posA)}</td><td>${fD(r.posB)}</td></tr>`;
  });
  html+='</tbody></table></div>';
  document.getElementById('brand-compare-wrap').innerHTML=`<div class="table-wrap">${html}</div>`;
}

function exportCSV(periodKey){
  const data=window[`tableData_${periodKey}`]||[];
  const period=PERIODS.find(p=>p.key===periodKey);
  const headers=['#','Categoría','Subcategoría','URLs','Impresiones','Δ Impr','% Δ Impr','Clics','Δ Clics','% Δ Clics','CTR','Δ CTR','Pos','Δ Pos','% Share','Gap vs #1'];
  const rows=data.map((r,i)=>[i+1,r.cat,r.subcat,r.urlCount,r.impr,r.dImpr,r.pctDImpr?.toFixed(1),r.clicks,r.dClicks,r.pctDClicks?.toFixed(1),r.ctr?.toFixed(2),r.dCtr?.toFixed(2),r.pos?.toFixed(1),r.dPos?.toFixed(1),r.share?.toFixed(1),r.gapVsTop]);
  const csv=[headers,...rows].map(r=>r.join(';')).join('\n');
  downloadFile(`cyber_pages_${period?.label||periodKey}.csv`, 'text/csv', csv);
}

function exportBrandCSV(periodKey){
  const data=window[`brandData_${periodKey}`]||[];
  const period=PERIODS.find(p=>p.key===periodKey);
  const headers=['#','Marca','Keywords','Impresiones','Δ Impr','% Δ Impr','Clics','Δ Clics','CTR','Pos','Δ Pos','% Share','Gap vs #1'];
  const rows=data.map((r,i)=>[i+1,r.brand,r.kwCount,r.impr,r.dImpr,r.pctDImpr?.toFixed(1),r.clicks,r.dClicks,r.ctr?.toFixed(2),r.pos?.toFixed(1),r.dPos?.toFixed(1),r.share?.toFixed(1),r.gapVsTop]);
  const csv=[headers,...rows].map(r=>r.join(';')).join('\n');
  downloadFile(`cyber_brands_${period?.label||periodKey}.csv`, 'text/csv', csv);
}

function downloadFile(name,type,content){
  const blob=new Blob(['\uFEFF'+content],{type:`${type};charset=utf-8`});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
}

function copyTable(tableId){
  const table=document.getElementById(tableId);
  if(!table) return;
  const rows=[...table.querySelectorAll('tr')];
  const tsv=rows.map(r=>[...r.querySelectorAll('th,td')].map(c=>c.textContent.trim()).join('\t')).join('\n');
  navigator.clipboard.writeText(tsv).then(()=>showToast('Tabla copiada al portapapeles'));
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}

    pageData[p.key]=rows;
    const dz=document.getElementById(`dz-page-${p.key}`);
    if(dz){dz.classList.add('loaded');const inf=document.getElementById(`dz-info-dz-page-${p.key}`);if(inf)inf.textContent=`✓ Demo · ${rows.length} filas`;}
  });

  const DEMO_BRANDS=['nike','adidas','samsung','apple','sony','lg','hp','lenovo','jbl','puma','converse','oster','lego','barbie','disney'];
  brandList=DEMO_BRANDS;
  buildBrandsIndex(DEMO_BRANDS);
  brandFileLoaded=true;
  const dz2=document.getElementById('dz-brand');
  if(dz2){dz2.classList.add('loaded');const inf=document.getElementById('dz-info-dz-brand');if(inf)inf.textContent=`✓ ${DEMO_BRANDS.length} marcas demo`;}

  const kwTemplates=[
    ['nike',4000],['zapatillas nike',3500],['zapatillas nike hombre',2800],['tenis nike',1800],
    ['adidas',3800],['zapatillas adidas',3200],['polera adidas',2100],['parka adidas',1500],
    ['samsung galaxy',3600],['tv samsung 55',2900],['samsung a35',2100],['celular samsung',1800],
    ['apple iphone',3100],['iphone 15',2800],['apple watch',2400],['airpods',2000],
    ['sony tv',2700],['audífonos sony',2200],['camara sony',1700],
    ['smart tv lg',2500],['lg nanocell',1900],['refrigerador lg',1600],
    ['laptop hp',2300],['impresora hp',1800],['hp pavilion',1400],
    ['lenovo thinkpad',2100],['laptop lenovo',1700],['tablet lenovo',1300],
    ['audífonos jbl',2000],['parlante jbl',1700],['jbl earbuds',1300],
    ['zapatillas puma',1900],['polera puma',1500],
    ['converse all star',1800],['zapatillas converse',1500],
    ['cafetera oster',1600],['licuadora oster',1300],
    ['lego star wars',1800],['lego technic',1500],['lego city',1200],
    ['muñeca barbie',1700],['barbie dreamhouse',1400],
    ['peluche disney',1600],['juguetes disney',1300],
    ['zapatillas sin marca',2000],['poleron hombre',1800],['vestido mujer',1600],
    ['cocina grill',1400],['colchon 2 plazas',1200],['sofa esquinero',1100],
  ];

  PERIODS.forEach(p=>{
    const mult=mults[p.key];
    const rows=kwTemplates.map(([kw,base])=>{
      const v=Math.round(base*mult*(0.8+Math.random()*0.4));
      const prev_v=Math.round(v*0.65);
      const dImpr=v-prev_v;
      return {key:kw,clicks:Math.round(v*0.03),dClicks:Math.round(dImpr*0.03),
        impr:v,dImpr,pos:+(3+Math.random()*10).toFixed(1),dPos:+(Math.random()*2-1).toFixed(1),
        ctr:+(2.5+Math.random()*3).toFixed(2),dCtr:+(Math.random()-0.5).toFixed(2)};
    });
    kwFiles[p.key]={name:`demo_kw_${p.key}.csv`,rows};
    kwData[p.key]=rows;
  });

  checkAnalyzeBtn();
  showToast('✅ Demo cargado en todos los slots');

  if(document.getElementById('dashboard').style.display==='block'){
    buildSubNavPages(); buildSubNavKw(); switchModule(currentModule);
  }
}

function clearAll(){
  PERIODS.forEach(p=>{pageFiles[p.key]=null;kwFiles[p.key]=null;delete pageData[p.key];delete kwData[p.key];});
  brandList=DEFAULT_BRANDS; buildBrandsIndex(DEFAULT_BRANDS); brandFileLoaded=true;
  initUploadUI();
  checkAnalyzeBtn();
  document.getElementById('upload-screen').style.display='block';
  document.getElementById('dashboard').style.display='none';
}

// =====================================================================
// INIT
// =====================================================================
buildBrandsIndex(DEFAULT_BRANDS);
initUploadUI();
</script>
